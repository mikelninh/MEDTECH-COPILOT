name: Publish public prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish fictional fieldnotes demo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build QR demo labels
        run: |
          python3 -m pip install --quiet qrcode
          python3 scripts/make_labels.py dist/qr
      - name: Assemble public-only files
        run: |
          mkdir -p dist/src dist/data
          cp index.html v4.css v5.css v6.css v7.css dist/
          cp src/retrieval.js src/scenarios.js src/fieldnotes.js dist/src/
          cp data/corpus.json dist/data/
          touch dist/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
