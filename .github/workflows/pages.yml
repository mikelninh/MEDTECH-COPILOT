name: Publish public prototype

on:
  workflow_run:
    workflows: ["Demo quality gates"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}
    name: Publish verified public fieldnotes demo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exactly the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Build QR demo labels
        run: |
          python3 -m pip install --quiet qrcode
          python3 scripts/make_labels.py dist/qr
      - name: Install pinned Mozilla PDF.js locally
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage self-hosted PDF.js browser library
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund pdfjs-dist@6.5.438
          mkdir -p dist/vendor
          cp node_modules/pdfjs-dist/build/pdf.mjs dist/vendor/pdf.mjs
          cp node_modules/pdfjs-dist/build/pdf.worker.mjs dist/vendor/pdf.worker.mjs
      - name: Assemble public-only files
        run: |
          mkdir -p dist/src dist/data
          cp index.html upload.html v4.css v5.css v6.css v7.css v8.css v9.css entry9.css source10.css v12.css v3.css v31.css v3-home.css dist/
          cp src/retrieval.js src/scenarios.js src/fieldnotes.js src/pdf_evidence.js src/pdf_demo.js src/upload_core.js src/upload_app.mjs src/source_router.js src/learning_loop.js src/evidence_highlight.js src/legal_evidence.js dist/src/
          cp data/corpus.json data/legal_faq.json data/answer_quality_rubric.json dist/data/
          mkdir -p dist/covers
          cp covers/lumen.svg covers/orion.svg covers/mpbetreibv.svg covers/mpdg.svg covers/arbschg.svg covers/mpamiv.svg covers/mpav.svg covers/own.svg dist/covers/
          touch dist/.nojekyll
      - name: Download the PDF index from the successfully tested run
        uses: actions/download-artifact@v4
        with:
          name: medtech-verified-pdf-index
          path: dist/data/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download checked public law and demo-manual PDFs
        uses: actions/download-artifact@v4
        with:
          name: medtech-source-examples
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check both verified source catalogs and documents
        run: |
          test -s dist/data/pdf_pages.json
          test -s dist/data/source_catalog.json
          test -s dist/examples/LUMEN-P200-demo.pdf
          test -s dist/examples/ORION-M100-demo.pdf
          test -s dist/examples/MPBetreibV.pdf
          test -s dist/examples/MPDG.pdf
          test -s dist/examples/ArbSchG.pdf
          test -s dist/examples/MPAMIV.pdf
          test -s dist/examples/MPAV.pdf
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
