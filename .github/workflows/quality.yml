name: Demo quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: medtech-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Retrieval and source-regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF extraction dependency
        run: python -m pip install --quiet pymupdf reportlab
      - name: Download, validate and index original Philips PDF
        run: |
          mkdir -p examples
          python scripts/ingest_philips_pdf.py --out data/pdf_pages.json
      - name: Verify 30 actual PDF-source questions
        run: node tests/pdf_evidence.cjs
      - name: Store tested public PDF index
        uses: actions/upload-artifact@v4
        with:
          name: medtech-verified-pdf-index
          path: data/pdf_pages.json
          if-no-files-found: error
          retention-days: 7
      - name: Generate GitLaw lawbook reader PDFs and verified handbook examples
        run: python scripts/build_gitlaw_books.py --out-dir examples --manifest data/source_catalog.json
      - name: Validate source catalog and PDF fingerprints
        run: node tests/source_catalog.cjs
      - name: Gate all 19 curated law questions against the fingerprint-pinned PDFs
        run: |
          python scripts/extract_gold_legal_pages.py /tmp/medtech-gold-pdf-pages.json
          node tests/legal_functional.cjs /tmp/medtech-gold-pdf-pages.json
      - name: Preserve exact checked PDF samples
        uses: actions/upload-artifact@v4
        with:
          name: medtech-source-examples
          path: |
            examples/
            data/source_catalog.json
          if-no-files-found: error
          retention-days: 7
      - name: Curated legal FAQ and privacy-only metric tests
        run: |
          node --check src/upload_app.mjs
          node --check src/learning_loop.js
          node --check src/evidence_highlight.js
          node --check src/legal_evidence.js
          node tests/evidence_highlight.cjs
          node tests/legal_faq.cjs
          node tests/learning_loop.cjs
      - name: Document ingestion sample tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: V0.9 upload retrieval – 70+ case audit
        run: node tests/upload_core.cjs
      - name: Retrieval, safety and version-control contract
        run: node tests/test_assistant.cjs
      - name: Strict adversarial and provenance audit
        run: node tests/strict_audit.cjs
      - name: Publish inspectable audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medtech-strict-audit
          path: |
            artifacts/strict_audit.json
            artifacts/strict_audit.md
            artifacts/v09-core-audit.json
            artifacts/legal_eval.json
          if-no-files-found: warn

  browser:
    name: Chromium E2E desktop/mobile
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use exact PDF index from verified source test
        uses: actions/download-artifact@v4
        with:
          name: medtech-verified-pdf-index
          path: data/
      - name: Load verified law and demo-manual examples
        uses: actions/download-artifact@v4
        with:
          name: medtech-source-examples
          path: .
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and QR build requirements
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1 pdfjs-dist@6.5.438
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet qrcode pymupdf
          python3 scripts/make_labels.py qr
          mkdir -p vendor
          cp node_modules/pdfjs-dist/build/pdf.mjs vendor/pdf.mjs
          cp node_modules/pdfjs-dist/build/pdf.worker.mjs vendor/pdf.worker.mjs
          python3 tests/make_upload_fixture.py /tmp/medtech_upload_fixture.pdf /tmp/medtech_upload_scanned.pdf
          python3 scripts/ingest_philips_pdf.py --out /tmp/medtech_v09_test_index.json --save-pdf /tmp/medtech_philips_original.pdf
      - name: Run full browser journeys
        run: |
          python3 -m http.server 4173 >/tmp/medtech-server.log 2>&1 &
          sleep 2
          node tests/browser_smoke.cjs
          node tests/upload_browser.cjs
          node tests/source_browser.cjs
      - name: Simulated user journeys (7 personas, 28 fresh questions)
        run: node tests/simulated_users.cjs
      - name: Upload actual UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medtech-fieldnotes-v10
          path: artifacts/
          if-no-files-found: ignore
