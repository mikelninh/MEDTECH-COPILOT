name: Demo quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python and assistant regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Document ingestion unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Assistant routing, refusal, and syntax tests
        run: node tests/test_assistant.cjs
